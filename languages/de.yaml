  DEFAULT_PAGES_SCOPE_LABEL: "Recently viewed pages: Standard-Filter"
  DEFAULT_PAGES_SCOPE_HELP: Welche Seiten die Karte „Recently viewed pages“ im 
    Admin2-Dashboard standardmäßig anzeigt. Besucher können das direkt im 
    Dashboard umschalten – diese Einstellung legt nur fest, was beim ersten 
    Laden zu sehen ist.
  DEFAULT_PAGES_SCOPE_ALL: Alle Seiten
  DEFAULT_PAGES_SCOPE_REAL: Nur echte Seiten
  DEFAULT_HIDE_BOTS_LABEL: "Bots ausblenden: Standard-Filter"
  DEFAULT_HIDE_BOTS_HELP: Ob der „Bots ausblenden"-Schalter im Admin2-Dashboard
    standardmäßig aktiv ist und dabei jede Kennzahl, jedes Diagramm und jede
    Liste auf nicht als Bot erkannte Zugriffe filtert. Admins können das direkt
    im Dashboard umschalten – diese Einstellung legt nur fest, was beim ersten
    Laden zu sehen ist. Basiert auf der Liste „Bot User Agents" weiter unten,
    ist also ein Best-Effort-Filter (nur erkannte Bots), keine Garantie für
    rein menschlichen Traffic.
