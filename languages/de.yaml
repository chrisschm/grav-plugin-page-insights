  ANONYMIZE_IPS_LABEL: IP-Adressen anonymisieren
  ANONYMIZE_IPS_HELP: 'Wenn diese Option aktiviert ist, werden IP-Adressen vor der
    Speicherung in der Datenbank nach 2 Bytes (bei IPv4) bzw. 4 Bytes (bei IPv6) gekürzt,
    um die Einhaltung der DSGVO zu erleichtern. HINWEIS: Dies gilt NUR für neu erfasste
    Besuche, NICHT für bereits in der Datenbank gespeicherte Einträge.'
  DATETIME_OFFSET_LABEL: Datum/Uhrzeit – Abweichung von UTC
  DATETIME_OFFSET_HELP: Datums-/Zeitwerte anzeigen, die um einen angegebenen 
    Offset gegenüber UTC angepasst wurden
  LOG_TIME_ON_PAGE_LABEL: Zeit auf der Seite protokollieren
  LOG_TIME_ON_PAGE_HELP: Wenn diese Funktion aktiviert ist, löst das Frontend in
    regelmäßigen Abständen ein Ping-Ereignis aus, um zu signalisieren, dass sich
    der Benutzer weiterhin auf der Seite befindet
  COLLECTOR_PING_INTERVAL_LABEL: Ping-Intervall für die Verweildauer auf der 
    Seite (Sekunden)
  COLLECTOR_PING_INTERVAL_HELP: Gibt an, wie oft (in Sekunden) das Frontend 
    einen Ping sendet, während die Option „Zeit auf der Seite protokollieren“ 
    aktiviert ist. Dies ist nur wirksam, wenn die entsprechende Option 
    eingeschaltet ist.
