  SECTION_GEOLOCATION: Geolokalisierung
  SECTION_GEOLOCATION_LABEL: Land-Ermittlung für IP-Adressen ("Top countries"). Es
    wird keine Drittanbieter-Datenbank mit dem Plugin ausgeliefert oder automatisch
    heruntergeladen; die (Neu-)Erstellung wird über den Button "Jetzt aktualisieren"
    bei "Top Länder" im Dashboard ausgelöst. Standardmäßig wird dabei ein bereits
    fertig gebauter Index von einem Begleitprojekt geladen, das ihn regelmäßig aus
    den öffentlichen RIR-Zuteilungsdaten (Regional Internet Registry) neu baut -
    siehe unten, um ihn stattdessen selbst lokal aus diesen Rohdaten zu bauen.
  GEO_DB_INDEX_PATH_LABEL: Pfad der Geo-Datenbank
  GEO_DB_INDEX_PATH_HELP: Pfad zur gebauten Indexdatei, relativ zum Grav-Root.
    Bewusst außerhalb des Plugin-eigenen Ordners, damit sie ein GPM-Update übersteht
    (das bei jeder Installation den kompletten Plugin-Ordner ersetzt).
  GEO_DB_SOURCE_MODE_LABEL: Quelle der Geo-Datenbank
  GEO_DB_SOURCE_MODE_HELP: "\"Fertiger Index\" lädt einen kleinen, bereits gebauten
    Index herunter und braucht dafür keinen zusätzlichen Arbeitsspeicher auf dieser
    Website. \"Aus RIR-Rohdaten selbst bauen\" lädt stattdessen den vollständigen,
    mehrere MB großen RIR-Datensatz und baut den Index hier vor Ort - ohne
    Abhängigkeit vom Begleitprojekt, dafür mit größerem Download und einem für den
    Bauvorgang vorübergehend angehobenen Speicherlimit."
  GEO_DB_SOURCE_MODE_PREBUILT: Fertiger Index (empfohlen)
  GEO_DB_SOURCE_MODE_RAW: Aus RIR-Rohdaten selbst bauen
  GEO_DB_PREBUILT_URL_LABEL: Quell-URL des fertigen Index
  GEO_DB_PREBUILT_URL_HELP: Optional, für Fortgeschrittene. Wird nur verwendet,
    wenn oben "Fertiger Index" ausgewählt ist. Leer lassen für das
    Standard-Begleitprojekt.
  GEO_DB_SOURCE_URL_LABEL: Quell-URL der RIR-Rohdaten
  GEO_DB_SOURCE_URL_HELP: Optional, für Fortgeschrittene. Wird nur verwendet, wenn
    oben "Aus RIR-Rohdaten selbst bauen" ausgewählt ist. Leer lassen für den
    Standard - den täglich aktualisierten, kombinierten RIR-Zuteilungsdatensatz,
    den die RIPE NCC im Auftrag der NRO veröffentlicht.
  GEO_DB_NOT_BUILT: Noch nicht erstellt - die Länderermittlung liefert bis zur
    ersten Aktualisierung "unknown".
  GEO_DB_BUILT_STATUS: Erstellt am %s (Datenstand %s, %s Einträge).
  GEO_DB_UNKNOWN: unbekannt
  GEO_DB_UPDATE_NOW: Jetzt aktualisieren
  GEO_DB_AUTO_UPDATE_LABEL: Automatische Aktualisierung
  GEO_DB_AUTO_UPDATE_HELP: Hält die Geo-Datenbank aktuell, ohne den "Jetzt
    aktualisieren"-Button (siehe cli/GeoDbUpdateCommand.php für den
    gleichwertigen CLI-Befehl, z. B. für einen eigenen Cron-Eintrag). Setzt
    voraus, dass Gravs eigener Scheduler aktiv ist (Admin -> Werkzeuge ->
    Scheduler); dafür ist kein zusätzlicher Crontab-Eintrag nötig. Wochentag/
    Tag im Monat und Uhrzeit sind hier bewusst nicht einstellbar - sie werden
    automatisch pro Installation ermittelt, damit sich nicht viele
    Installationen zum selben, naheliegenden Zeitpunkt häufen.
  SECTION_DATA_RETENTION: Datenaufbewahrung
  SECTION_DATA_RETENTION_LABEL: Optionales, unwiderrufliches Löschen alter
    Seitenaufruf-/Event-Daten. Standardmäßig deaktiviert. Siehe auch die
    CLI-Befehle `prune`/`vacuum`/`events:prune-orphans` für einmalige oder
    skriptgesteuerte Nutzung.
  DATA_AUTO_PRUNE_LABEL: Automatisches Löschen
  DATA_AUTO_PRUNE_HELP: Löscht Seitenaufruf-/Event-Daten automatisch, die
    älter sind als die unten angegebene Aufbewahrungsdauer. Standardmäßig
    deaktiviert - dies löscht Daten unwiderruflich. Wie bei der automatischen
    Geo-Datenbank-Aktualisierung werden Wochentag/Tag im Monat und Uhrzeit
    automatisch pro Installation ermittelt statt einstellbar zu sein, um eine
    Häufung vieler Installationen auf denselben Zeitpunkt zu vermeiden; die
    Datenbankdatei selbst wird dabei nie automatisch verkleinert (VACUUM) -
    dafür separat den `vacuum`-CLI-Befehl verwenden.
  DATA_AUTO_PRUNE_OLDER_THAN_LABEL: Aufbewahrungsdauer
  DATA_AUTO_PRUNE_OLDER_THAN_HELP: Wie weit zurück Daten aufbewahrt werden,
    wenn automatisches Löschen oben aktiviert ist. Entweder relativ ("90d",
    "12w", "6m", "1y") oder ein absolutes Datum ("2025-01-01") - dieselbe
    Syntax wie die --older-than-Option des `prune`-CLI-Befehls.
  AUTO_SCHEDULE_DISABLED: Deaktiviert
  AUTO_SCHEDULE_WEEKLY: Wöchentlich
  AUTO_SCHEDULE_MONTHLY: Monatlich
  AUTO_SCHEDULE_DAILY: Täglich

  SECTION_ROLLUP: Dashboard-Rollups
  SECTION_ROLLUP_LABEL: Berechnet tägliche Zusammenfassungen im Voraus, damit
    Dashboard-Widgets auch bei Sites mit viel angesammeltem Traffic schnell
    bleiben, statt bei jedem Laden erneut jede passende Zeile zu aggregieren.
    Standardmäßig deaktiviert - lohnt sich erst, wenn Traffic/Historie einer
    Site das Dashboard spürbar verlangsamen; kleine/neue Sites benötigen dies
    nicht. Siehe auch den `rollup:build`-CLI-Befehl, den diese Einstellung
    lediglich automatisiert.
  ROLLUP_AUTO_BUILD_LABEL: Automatische Rollups
  ROLLUP_AUTO_BUILD_HELP: Führt für jeden abgeschlossenen Tag automatisch ein
    Rollup aus (siehe `rollup:build --help`). Standardmäßig deaktiviert.
    Anders als bei den Wochen-/Monats-Optionen oben wird hier nur "Täglich"
    angeboten - ein Rollup, das eine Woche hinterherhinkt, verfehlt seinen
    Zweck, da das Dashboard für alles noch nicht Zusammengefasste einfach auf
    die ursprüngliche, unbeschleunigte Abfrage zurückfällt. Das Aktivieren
    füllt bestehende Historie nicht rückwirkend auf - dafür einmalig selbst
    `bin/plugin page-insights rollup:build --from=<zeitraum>` ausführen;
    diese Einstellung hält es nur ab jetzt aktuell.

  SECTION_SCAN_DETECTION: Scan-Erkennung
  SECTION_SCAN_DETECTION_LABEL: Gleicht periodisch zuletzt erfasste 404-Treffer
    mit einer gepflegten Liste bekannter, für Angriffe typischer Pfade ab und
    löst einen Alarm aus, sobald eine IP zu viele verschiedene Treffer in zu
    kurzer Zeit erzeugt - typischerweise ein Zeichen für automatisiertes
    Scannen, kein einzelner defekter Link. Standardmäßig deaktiviert, und die
    Musterliste startet leer - siehe `scan-patterns:import` oder die Ansicht
    "Scan-Erkennung" in der Admin2-Seitenleiste zum Befüllen.
  SCAN_DETECTION_LABEL: Scan-Erkennung aktivieren
  SCAN_DETECTION_HELP: Läuft alle 5 Minuten über Gravs eigenen Scheduler
    (bin/grav scheduler) - kein separater Cron-Eintrag nötig. Liest
    ausschließlich bereits erfasste 404-Treffer; kein zusätzlicher Aufwand pro
    Anfrage.
  SCAN_DETECTION_THRESHOLD_LABEL: Alarm-Schwellenwert
  SCAN_DETECTION_THRESHOLD_HELP: Anzahl verschiedener passender Pfade derselben
    IP innerhalb des unten angegebenen Zeitfensters, die als Alarm zählen.
  SCAN_DETECTION_WINDOW_LABEL: Erkennungsfenster (Minuten)
  SCAN_DETECTION_WINDOW_HELP: Wie weit jeder Durchlauf zurückblickt und wie
    lange ein Alarm danach als "offen" gilt.
  SCAN_DETECTION_EMAIL_LABEL: E-Mail-Adresse für Alarme
  SCAN_DETECTION_EMAIL_HELP: Optional. Erfordert das separate, offizielle
    "email"-Plugin (bin/gpm install email), installiert und konfiguriert -
    sonst passiert nichts. Leer lassen für ausschließlich
    Dashboard-Benachrichtigungen.
  SCAN_ALERT_TITLE: Möglicher Schwachstellen-Scan erkannt
  SCAN_ALERT_MESSAGE: "IP %s hat %s verschiedene bekannt verwundbare Pfade in
    kurzer Zeit angefragt - das deutet typischerweise auf automatisiertes
    Scannen hin, nicht auf normalen Besucherverkehr. Details in der Ansicht
    \"Scan-Erkennung\"."

