PLUGIN_PAGE_INSIGHTS:
    PAGE_STATS: Page Insights
    STATS_DB_LABEL: Page Insights DB path
    STATS_DB_HELP: Path to db relative to Grav root

    TAB_GENERAL: General
    TAB_CLASSIC_ADMIN: "Grav 1.7 / Classic Admin"
    TAB_ADMIN2: "Grav 2.0 / Admin2"
    TAB_CLASSIC_ADMIN_INFO: "These settings only affect the classic Admin (Grav 1.x) dashboard widgets and detail pages. They have no effect on the Admin2 (Grav 2.0) dashboard."
    TAB_ADMIN2_INFO: "The Admin2 dashboard currently has no additional settings of its own - its layout is defined directly in admin-next/pages/page-insights.js. This tab is reserved for future Admin2-specific options."
    TAB_INFO_TITLE: Information

    DEFAULT_PAGES_SCOPE_LABEL: "Recently viewed pages: default filter"
    DEFAULT_PAGES_SCOPE_HELP: "Which pages the Admin2 dashboard's \"Recently viewed pages\" card shows by default. Visitors can still switch this on the dashboard itself - this only sets what they see on first load."
    DEFAULT_PAGES_SCOPE_ALL: "All pages"
    DEFAULT_PAGES_SCOPE_REAL: "Real pages only"

    WIDGET:
        ENABLED:
            TEXT: Enabled
            HELP: If Enabled the widget will be shown
        SIZE:
            TEXT: Size
            HELP: The size of the widget on the dashboard
        LIMIT:
            TEXT: Limit
            HELP: The number of records to fetch
        STYLE:
            TEXT: Style
            HELP: The style used to present data (table or chart)

    ANONYMIZE_IPS_LABEL: Anonymize IP-addresses
    ANONYMIZE_IPS_HELP: "If enabled IP-addresses will be truncated after 2 Bytes (for IPv4) and 4 Bytes (for IPv6) before storing to database for eased GDPR compliance. NOTICE: This ONLY applies for NEWLY recorded visits, NOT for entries already recorded in the database."

    TRUST_PROXY_HEADERS_LABEL: Trust proxy headers for visitor IP
    TRUST_PROXY_HEADERS_HELP: "If enabled, the CF-Connecting-IP, Client-IP and X-Forwarded-For headers are used to determine the visitor's IP address. Only enable this if your site is guaranteed to sit behind a trusted reverse proxy (e.g. Cloudflare) for every request - otherwise visitors can forge these headers themselves. Leave disabled to always use the direct connection IP."

    DATETIME_OFFSET_LABEL: Date Time Offset From UTC
    DATETIME_OFFSET_HELP: Display date/time values adjusted from UTC by specified offset

    LOG_TIME_ON_PAGE_LABEL: Log time on page
    LOG_TIME_ON_PAGE_HELP: If enabled Front End will trigger a ping event at regular intervals to mark the user as still on the page
    COLLECTOR_PING_INTERVAL_LABEL: Time on page ping interval (seconds)
    COLLECTOR_PING_INTERVAL_HELP: How often (in seconds) the Front End sends a ping while "Log time on page" is enabled. Only takes effect if that option is on.
