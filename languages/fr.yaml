  TAB_ADMIN2: "Grav 2.0 / Admin2"
  TAB_CLASSIC_ADMIN_INFO: "Ces réglages n'affectent que les widgets et pages de détail
    du tableau de bord de l'admin classique (Grav 1.x). Ils n'ont aucun effet sur
    le tableau de bord Admin2 (Grav 2.0)."
  TAB_ADMIN2_INFO: "Ces réglages n'affectent que le tableau de bord Admin2 (Grav 2.0).
    Ils n'ont aucun effet sur le tableau de bord de l'admin classique (Grav 1.x)."
  TAB_INFO_TITLE: Information

  DEFAULT_PAGES_SCOPE_LABEL: "Pages récemment consultées : filtre par défaut"
  DEFAULT_PAGES_SCOPE_HELP: "Quelles pages la carte « Recently viewed pages » du tableau de bord
    Admin2 affiche par défaut. Les visiteurs peuvent toujours basculer ce réglage directement
    dans le tableau de bord - ceci ne définit que ce qu'ils voient au premier chargement."
