      HELP: Le style utilisé pour présenter les données (tableau ou graphique)

  ANONYMIZE_IPS_LABEL: Anonymiser les adresses IP
  ANONYMIZE_IPS_HELP: "Si activé, les adresses IP seront tronquées après 2 octets
    (pour IPv4) et 4 octets (pour IPv6) avant d'être stockées dans la base de données,
    pour faciliter la conformité RGPD. REMARQUE : Cela ne s'applique qu'aux NOUVELLES
    visites enregistrées, PAS aux entrées déjà présentes dans la base de données."

  TRUST_PROXY_HEADERS_LABEL: Faire confiance aux en-têtes proxy pour l'IP du visiteur
  TRUST_PROXY_HEADERS_HELP: "Si activé, les en-têtes CF-Connecting-IP, Client-IP et
    X-Forwarded-For sont utilisés pour déterminer l'adresse IP du visiteur. À
    n'activer que si le site est garanti d'être derrière un proxy inverse de
    confiance (par ex. Cloudflare) pour chaque requête - sinon les visiteurs
    peuvent falsifier ces en-têtes eux-mêmes. Laisser désactivé pour toujours
    utiliser l'IP de connexion directe."

  DATETIME_OFFSET_LABEL: Décalage horaire par rapport à UTC
  DATETIME_OFFSET_HELP: Affiche les valeurs de date/heure ajustées par rapport à
    UTC selon le décalage spécifié

  LOG_TIME_ON_PAGE_LABEL: Enregistrer le temps passé sur la page
  LOG_TIME_ON_PAGE_HELP: "Si activé, le front-end déclenchera un événement de ping
    à intervalles réguliers pour indiquer que l'utilisateur est toujours sur la page"
  COLLECTOR_PING_INTERVAL_LABEL: "Intervalle de ping (temps passé sur la page, en
    secondes)"
  COLLECTOR_PING_INTERVAL_HELP: "Fréquence (en secondes) à laquelle le front-end envoie
    un ping lorsque « Enregistrer le temps passé sur la page » est activé. N'a d'effet
    que si cette option est active."
    # STATS_DB_CREATE_LABEL: Reconstruire la base de données des statistiques
