  SECTION_BOTS: Robots
  SECTION_BOTS_TEXT: "Identifier les robots d'indexation"
  BOT_REGEXP:
    TEXT: Agents utilisateurs des robots
    HELP: Agents utilisateurs à classer comme robots (peut utiliser des
      expressions régulières)
  SECTION_GEOLOCATION: Géolocalisation
  SECTION_GEOLOCATION_LABEL: "Détermination du pays à partir de l'IP (\"Top
    countries\"). Aucune base de données tierce n'est fournie avec le plugin
    ni téléchargée automatiquement ; utilisez le bouton \"Mettre à jour\" à
    côté de Top countries dans le tableau de bord pour la (re)générer. Par
    défaut, cela télécharge un index déjà généré depuis un projet compagnon
    qui le reconstruit périodiquement à partir des données publiques
    d'allocation des RIR (Regional Internet Registry) - voir ci-dessous pour
    le générer vous-même localement à partir de ces données brutes."
  GEO_DB_INDEX_PATH_LABEL: Chemin de l'index géographique
  GEO_DB_INDEX_PATH_HELP: "Chemin vers le fichier d'index généré, relatif à la
    racine de Grav. Délibérément en dehors du dossier propre du plugin, afin
    qu'il survive à une mise à jour GPM (qui remplace tout le dossier du
    plugin à chaque installation)."
  GEO_DB_SOURCE_MODE_LABEL: Source de la base géographique
  GEO_DB_SOURCE_MODE_HELP: "\"Index préconstruit\" télécharge un petit index
    déjà généré et ne nécessite pas de mémoire supplémentaire sur ce site.
    \"Générer à partir des données RIR brutes\" télécharge le fichier RIR
    complet (plusieurs Mo) et génère l'index ici même, sans dépendre du
    projet compagnon - téléchargement plus volumineux et limite de mémoire
    temporairement relevée pendant la génération."
  GEO_DB_SOURCE_MODE_PREBUILT: Index préconstruit (recommandé)
  GEO_DB_SOURCE_MODE_RAW: Générer à partir des données RIR brutes
  GEO_DB_PREBUILT_URL_LABEL: URL source de l'index préconstruit
  GEO_DB_PREBUILT_URL_HELP: "Facultatif, pour utilisateurs avancés. Utilisé
    uniquement si \"Index préconstruit\" est sélectionné ci-dessus. Laisser
    vide pour utiliser le projet compagnon par défaut."
  GEO_DB_SOURCE_URL_LABEL: URL source des données RIR brutes
  GEO_DB_SOURCE_URL_HELP: "Facultatif, pour utilisateurs avancés. Utilisé
    uniquement si \"Générer à partir des données RIR brutes\" est sélectionné
    ci-dessus. Laisser vide pour utiliser la valeur par défaut : le fichier
    combiné d'allocation des RIR, publié quotidiennement par le RIPE NCC pour
    le compte de la NRO."
  GEO_DB_NOT_BUILT: "Pas encore générée - la détermination du pays renvoie
    \"unknown\" jusqu'à la première mise à jour."
  GEO_DB_BUILT_STATUS: "Générée le %s (date des données %s, %s entrées)."
  GEO_DB_UNKNOWN: inconnu
  GEO_DB_UPDATE_NOW: Mettre à jour
  GEO_DB_AUTO_UPDATE_LABEL: Mise à jour automatique
  GEO_DB_AUTO_UPDATE_HELP: "Maintient la base géographique à jour sans passer
    par le bouton \"Mettre à jour\" (voir cli/GeoDbUpdateCommand.php pour la
    commande CLI équivalente, par ex. pour une tâche cron dédiée). Nécessite
    que le Scheduler intégré de Grav soit actif (Admin -> Outils ->
    Scheduler) ; aucune ligne crontab supplémentaire n'est nécessaire pour
    cela en particulier. Le jour de la semaine/du mois et l'heure exacts ne
    sont volontairement pas configurables ici - ils sont déterminés
    automatiquement pour chaque installation, afin d'éviter que de
    nombreuses installations ne s'exécutent toutes au même moment habituel."

  SECTION_DATA_RETENTION: Conservation des données
  SECTION_DATA_RETENTION_LABEL: "Suppression optionnelle et irréversible des
    anciennes données de visites/événements. Désactivée par défaut. Voir
    aussi les commandes CLI `prune`/`vacuum`/`events:prune-orphans` pour une
    utilisation ponctuelle ou scriptée."
  DATA_AUTO_PRUNE_LABEL: Suppression automatique
  DATA_AUTO_PRUNE_HELP: "Supprime automatiquement les données de visites/
    événements plus anciennes que la période de conservation ci-dessous.
    Désactivée par défaut - cette action supprime définitivement des
    données. Comme pour la mise à jour automatique de la base géographique,
    le jour de la semaine/du mois et l'heure sont déterminés automatiquement
    pour chaque installation plutôt que configurables, afin d'éviter que de
    nombreuses installations ne se concentrent sur le même moment ; le
    fichier de base de données lui-même n'est jamais réduit automatiquement
    (VACUUM) dans ce cadre - utiliser séparément la commande CLI `vacuum`
    pour cela."
  DATA_AUTO_PRUNE_OLDER_THAN_LABEL: Période de conservation
  DATA_AUTO_PRUNE_OLDER_THAN_HELP: "Jusqu'où remonter avant de conserver les
    données lorsque la suppression automatique ci-dessus est activée. Soit
    relative (\"90d\", \"12w\", \"6m\", \"1y\"), soit une date absolue
    (\"2025-01-01\") - même syntaxe que l'option --older-than de la commande
    CLI `prune`."
  AUTO_SCHEDULE_DISABLED: Désactivée
  AUTO_SCHEDULE_WEEKLY: Hebdomadaire
  AUTO_SCHEDULE_MONTHLY: Mensuelle

