name: Page Insights
slug: page-insights
type: plugin
version: 3.1.1
description: Enhanced page/user analytics for Grav, with Admin2 support. Independent fork of Page Stats by Nuno Costa.
icon: plug
author:
    name: Christian Schmidt
    email: christian.schmidt@jcs-net.de
homepage: https://codeberg.org/chschmidt/grav-plugin-page-insights
keywords: grav, plugin, analytics, statistics
bugs: https://codeberg.org/chschmidt/grav-plugin-page-insights/issues
docs: https://codeberg.org/chschmidt/grav-plugin-page-insights/src/branch/main/README.md
license: MIT

# GPM reads "dependencies" (not "compatibility" below) to decide which
# sites this plugin gets offered to. The actual floor is Grav 1.7 /
# PHP 8.0+ (composer.json requires php >=8.0; classes/Stats.php uses
# str_contains(), a PHP 8.0 function) - anything older would fatal, so the
# dependency here must match, not just the aspirational "works with 1.6+"
# note it previously carried.
dependencies:
    - { name: grav, version: ">=1.7.0" }

# Declares compatibility with the Grav 2.0 API plugin / Admin2.
# See classes/Api/PageInsightsApiController.php and admin-next/pages/page-insights.js.
# Classic Admin (Grav < 2.0) continues to work unchanged via the existing
# onAdminDashboard/onAdminPage hooks in page-insights.php.
compatibility:
    grav:
        - '1.7'
        - '2.0'
    api:
        - 1.0

x-widget-enabled: &widget-enabled
    type: toggle
    label: PLUGIN_PAGE_INSIGHTS.WIDGET.ENABLED.TEXT
    help: PLUPLUGIN_PAGE_INSIGHTS.WIDGET.ENABLED.HELP
    highlight: 1
    default: 1
    options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
    validate:
        type: bool
x-widget-size: &widget-size
    type: select
    label: PLUGIN_PAGE_INSIGHTS.WIDGET.SIZE.TEXT
    help: PLUGIN_PAGE_INSIGHTS.WIDGET.SIZE.HELP
    options:
        'col-12 col-md-3' : small
        'col-12 col-md-4': 'medium'
        'col-12 col-md-6': 'large'
        'col-12': 'full width'
x-widget-style: &widget-style
    type: select
    label: PLUGIN_PAGE_INSIGHTS.WIDGET.STYLE.TEXT
    help: PLUGIN_PAGE_INSIGHTS.WIDGET.STYLE.HELP
    options:
        'table' : table
        'chart': chart

x-widget-limit: &widget-limit
    type: number
    label: PLUGIN_PAGE_INSIGHTS.WIDGET.LIMIT.TEXT
    help: PLUGIN_PAGE_INSIGHTS.WIDGET.LIMIT.HELP
form:
    validation: loose
    fields:
        tabs:
            type: tabs
            fields:
                tab_general:
                    type: tab
                    title: PLUGIN_PAGE_INSIGHTS.TAB_GENERAL
                    fields:
                        enabled:
                            type: toggle
                            label: PLUGIN_ADMIN.PLUGIN_STATUS
                            highlight: 1
                            default: 0
                            options:
                                1: PLUGIN_ADMIN.ENABLED
                                0: PLUGIN_ADMIN.DISABLED
                            validate:
                                type: bool
                        ignore_errors:
                            type: toggle
                            label: PLUGIN_PAGE_INSIGHTS.IGNORE_ERRORS_LABEL
                            help: PLUGIN_PAGE_INSIGHTS.IGNORE_ERRORS_HELP
                            highlight: 1
                            default: 0
                            options:
                                1: PLUGIN_ADMIN.ENABLED
                                0: PLUGIN_ADMIN.DISABLED
                            validate:
                                type: bool
                        db:
                            type: text
                            label: PLUGIN_PAGE_INSIGHTS.STATS_DB_LABEL
                            help: PLUGIN_PAGE_INSIGHTS.STATS_DB_HELP

                        anonymize_ips:
                            type: toggle
                            label: PLUGIN_PAGE_INSIGHTS.ANONYMIZE_IPS_LABEL
                            help: PLUGIN_PAGE_INSIGHTS.ANONYMIZE_IPS_HELP
                            highlight: 1
                            default: 0
                            options:
                                1: PLUGIN_ADMIN.ENABLED
                                0: PLUGIN_ADMIN.DISABLED
                            validate:
                                type: bool

                        trust_proxy_headers:
                            type: toggle
                            label: PLUGIN_PAGE_INSIGHTS.TRUST_PROXY_HEADERS_LABEL
                            help: PLUGIN_PAGE_INSIGHTS.TRUST_PROXY_HEADERS_HELP
                            highlight: 1
                            default: 0
                            options:
                                1: PLUGIN_ADMIN.ENABLED
                                0: PLUGIN_ADMIN.DISABLED
                            validate:
                                type: bool

                        section_behaviour:
                            type: section
                            title: PLUGIN_PAGE_INSIGHTS.SECTION_BEHAVIOUR
                            text: PLUGIN_PAGE_INSIGHTS.SECTION_BEHAVIOUR_LABEL
                            underline: true
                            fields:
                                datetime_offset:
                                    type: text
                                    label: PLUGIN_PAGE_INSIGHTS.DATETIME_OFFSET_LABEL
                                    help: PLUGIN_PAGE_INSIGHTS.DATETIME_OFFSET_HELP
                                    default: 'localtime'
                                    validate:
                                      # \d rather than the POSIX class [[:digit:]]: POSIX classes
                                      # are valid PCRE (server-side PHP validation) but not valid
                                      # JS RegExp syntax - Admin2 constructs a native RegExp
                                      # straight from this string client-side, so [[:digit:]] threw
                                      # "Invalid regular expression" in the browser console on
                                      # every page using this blueprint. \d works identically in
                                      # both PCRE and JS.
                                      pattern: '[+-]\d{2,2}:\d{2,2}|localtime'
                                log_admin:
                                    type: toggle
                                    label: PLUGIN_PAGE_INSIGHTS.LOG_ADMIN_LABEL
                                    help: PLUGIN_PAGE_INSIGHTS.LOG_ADMIN_HELP
                                    highlight: 0
                                    default: 0
                                    options:
                                        1: PLUGIN_ADMIN.ENABLED
                                        0: PLUGIN_ADMIN.DISABLED
                                    validate:
                                        type: bool
                                log_time_on_page:
                                    type: toggle
                                    label: PLUGIN_PAGE_INSIGHTS.LOG_TIME_ON_PAGE_LABEL
                                    help: PLUGIN_PAGE_INSIGHTS.LOG_TIME_ON_PAGE_HELP
                                    highlight: 1
                                    default: 1
                                    options:
                                        1: PLUGIN_ADMIN.ENABLED
                                        0: PLUGIN_ADMIN.DISABLED
                                    validate:
                                        type: bool
                                collector_ping_interval:
                                    type: number
                                    label: PLUGIN_PAGE_INSIGHTS.COLLECTOR_PING_INTERVAL_LABEL
                                    help: PLUGIN_PAGE_INSIGHTS.COLLECTOR_PING_INTERVAL_HELP
                                    default: 15
                                    validate:
                                        type: number
                                        min: 1
                                log_bot:
                                    type: toggle
                                    label: PLUGIN_PAGE_INSIGHTS.LOG_BOT_LABEL
                                    help: PLUGIN_PAGE_INSIGHTS.LOG_BOT_HELP
                                    highlight: 0
                                    default: 0
                                    options:
                                        1: PLUGIN_ADMIN.ENABLED
                                        0: PLUGIN_ADMIN.DISABLED
                                    validate:
                                        type: bool
                                ignored_ips:
                                    type: list
                                    label: PLUGIN_PAGE_INSIGHTS.IGNORED_IPS_LABEL
                                    help: PLUGIN_PAGE_INSIGHTS.IGNORED_IPS_HELP
                                    style: vertical
                                    fields:
                                        .ip:
                                            type: text
                                            label: PLUGIN_PAGE_INSIGHTS.IP
                                            help: PLUGIN_PAGE_INSIGHTS.IGNORED_IPS_HELP
                                ignored_urls:
                                    type: list
                                    label: PLUGIN_PAGE_INSIGHTS.IGNORED_URLS.LABEL
                                    help: PLUGIN_PAGE_INSIGHTS.IGNORED_URLS.HELP
                                    style: vertical
                                    fields:
                                        .url:
                                            type: text
                                            label: PLUGIN_PAGE_INSIGHTS.IGNORED_URLS.TEXT
                                            help: PLUGIN_PAGE_INSIGHTS.IGNORED_URLS.HELP
                                fs11:
                                    type: fieldset
                                    title: PLUGIN_PAGE_INSIGHTS.BOT_REGEXP.TEXT
                                    collapsed: true      # Initial state of fieldset (see collapsible option)
                                    collapsible: true    # Whether one can expand the fieldset or not
                                    fields:
                                        bot_regexp:
                                            type: array
                                            value_only: true
                                            label: PLUGIN_PAGE_INSIGHTS.BOT_REGEXP.TEXT
                                            help: PLUGIN_PAGE_INSIGHTS.BOT_REGEXP.HELP

                        section_geolocation:
                            type: section
                            title: PLUGIN_PAGE_INSIGHTS.SECTION_GEOLOCATION
                            text: PLUGIN_PAGE_INSIGHTS.SECTION_GEOLOCATION_LABEL
                            underline: true
                            fields:
                                geo_db_source_mode:
                                    type: select
                                    label: PLUGIN_PAGE_INSIGHTS.GEO_DB_SOURCE_MODE_LABEL
                                    help: PLUGIN_PAGE_INSIGHTS.GEO_DB_SOURCE_MODE_HELP
                                    default: prebuilt
                                    options:
                                        prebuilt: PLUGIN_PAGE_INSIGHTS.GEO_DB_SOURCE_MODE_PREBUILT
                                        raw: PLUGIN_PAGE_INSIGHTS.GEO_DB_SOURCE_MODE_RAW
                                geo_db_prebuilt_url:
                                    type: text
                                    label: PLUGIN_PAGE_INSIGHTS.GEO_DB_PREBUILT_URL_LABEL
                                    help: PLUGIN_PAGE_INSIGHTS.GEO_DB_PREBUILT_URL_HELP
                                    placeholder: 'https://codeberg.org/chschmidt/page-insights-geo-db/releases/download/latest/geo-country-index.bin'
                                geo_db_source_url:
                                    type: text
                                    label: PLUGIN_PAGE_INSIGHTS.GEO_DB_SOURCE_URL_LABEL
                                    help: PLUGIN_PAGE_INSIGHTS.GEO_DB_SOURCE_URL_HELP
                                    placeholder: 'https://ftp.ripe.net/pub/stats/ripencc/nro-stats/latest/nro-delegated-stats'
                tab_classic_admin:
                    type: tab
                    title: PLUGIN_PAGE_INSIGHTS.TAB_CLASSIC_ADMIN
                    fields:
                        classic_admin_info:
                            type: section
                            title: PLUGIN_PAGE_INSIGHTS.TAB_INFO_TITLE
                            text: PLUGIN_PAGE_INSIGHTS.TAB_CLASSIC_ADMIN_INFO
                            underline: true
                            wrapper_classes: "rounded-lg border p-4"
                            fields: {}
                        page_url_format:
                            type: select
                            label: PLUGIN_PAGE_INSIGHTS.PAGE_URL.TEXT
                            help: PLUGIN_PAGE_INSIGHTS.PAGE_URL.HELP
                            options:
                                'url': 'Url'
                                'title': 'Title'

                        section_widgets:
                            type: section
                            title: PLUGIN_PAGE_INSIGHTS.SECTION_WIDGETS
                            text: PLUGIN_PAGE_INSIGHTS.SECTION_WIDGETS_LABEL
                            underline: true
                            fields:
                                fs2:
                                    type: fieldset
                                    title: PLUGIN_PAGE_INSIGHTS.UNIQUE_USERS_WIDGET
                                    collapsed: false      # Initial state of fieldset (see collapsible option)
                                    collapsible: true    # Whether one can expand the fieldset or not
                                    fields:
                                        show_unique_users_widget: *widget-enabled
                                        cols_unique_users_widget: *widget-size
                                fs3:
                                    type: fieldset
                                    title: PLUGIN_PAGE_INSIGHTS.UNIQUE_VISITORS_WIDGET
                                    collapsed: false      # Initial state of fieldset (see collapsible option)
                                    collapsible: true    # Whether one can expand the fieldset or not
                                    fields:
                                        show_unique_visitors_widget: *widget-enabled
                                        cols_unique_visitors_widget: *widget-size
                                fs4:
                                    type: fieldset
                                    title: PLUGIN_PAGE_INSIGHTS.PAGE_VIEWS_WIDGET
                                    collapsed: false      # Initial state of fieldset (see collapsible option)
                                    collapsible: true    # Whether one can expand the fieldset or not
                                    fields:
                                        show_page_views_widget: *widget-enabled
                                        cols_page_views_widget: *widget-size
                                fs1:
                                    type: fieldset
                                    title: PLUGIN_PAGE_INSIGHTS.TOP_USERS_WIDGET
                                    collapsed: false      # Initial state of fieldset (see collapsible option)
                                    collapsible: true    # Whether one can expand the fieldset or not
                                    fields:
                                        show_top_users_widget: *widget-enabled
                                        cols_top_users_widget: *widget-size
                                        limit_top_users_widget: *widget-limit
                                fs7:
                                    type: fieldset
                                    title: PLUGIN_PAGE_INSIGHTS.TOP_BROWSERS
                                    collapsed: false      # Initial state of fieldset (see collapsible option)
                                    collapsible: true    # Whether one can expand the fieldset or not
                                    fields:
                                        show_top_browsers: *widget-enabled
                                        cols_top_browsers: *widget-size
                                        limit_top_browsers: *widget-limit
                                        style_top_browsers: *widget-style
                                fs8:
                                    type: fieldset
                                    title: PLUGIN_PAGE_INSIGHTS.TOP_COUNTRIES
                                    collapsed: false      # Initial state of fieldset (see collapsible option)
                                    collapsible: true    # Whether one can expand the fieldset or not
                                    fields:
                                        show_top_countries: *widget-enabled
                                        cols_top_countries: *widget-size
                                        limit_top_countries: *widget-limit
                                        style_top_countries: *widget-style
                                fs9:
                                    type: fieldset
                                    title: PLUGIN_PAGE_INSIGHTS.TOP_PLATFORMS
                                    collapsed: false      # Initial state of fieldset (see collapsible option)
                                    collapsible: true    # Whether one can expand the fieldset or not
                                    fields:
                                        show_top_platforms: *widget-enabled
                                        cols_top_platforms: *widget-size
                                        limit_top_platforms: *widget-limit
                                        style_top_platforms: *widget-style

                                fs5:
                                    type: fieldset
                                    title: PLUGIN_PAGE_INSIGHTS.RECENTLY_VIEWED_PAGES
                                    collapsed: false      # Initial state of fieldset (see collapsible option)
                                    collapsible: true    # Whether one can expand the fieldset or not
                                    fields:
                                        show_recently_viewed_pages: *widget-enabled
                                        cols_recently_viewed_pages: *widget-size
                                        limit_recently_viewed_pages: *widget-limit
                                fs6:
                                    type: fieldset
                                    title: PLUGIN_PAGE_INSIGHTS.TOP_PAGES
                                    collapsed: false      # Initial state of fieldset (see collapsible option)
                                    collapsible: true    # Whether one can expand the fieldset or not
                                    fields:
                                        show_top_pages: *widget-enabled
                                        cols_top_pages: *widget-size
                                        limit_top_pages_pages: *widget-limit
                                fs10:
                                    type: fieldset
                                    title: PLUGIN_PAGE_INSIGHTS.PAGE_DETAILS.RECENT_VIEWS
                                    collapsed: false      # Initial state of fieldset (see collapsible option)
                                    collapsible: true    # Whether one can expand the fieldset or not
                                    fields:
                                        show_pagedetails_recent_views: *widget-enabled
                                        cols_pagedetails_recent_views: *widget-size
                                        limit_pagedetails_recent_views: *widget-limit

                tab_admin2:
                    type: tab
                    title: PLUGIN_PAGE_INSIGHTS.TAB_ADMIN2
                    fields:
                        admin2_info:
                            type: section
                            title: PLUGIN_PAGE_INSIGHTS.TAB_INFO_TITLE
                            text: PLUGIN_PAGE_INSIGHTS.TAB_ADMIN2_INFO
                            underline: true
                            wrapper_classes: "rounded-lg border p-4"
                            fields: {}
                        default_pages_scope:
                            type: toggle
                            label: PLUGIN_PAGE_INSIGHTS.DEFAULT_PAGES_SCOPE_LABEL
                            help: PLUGIN_PAGE_INSIGHTS.DEFAULT_PAGES_SCOPE_HELP
                            highlight: real
                            default: all
                            options:
                                all: PLUGIN_PAGE_INSIGHTS.DEFAULT_PAGES_SCOPE_ALL
                                real: PLUGIN_PAGE_INSIGHTS.DEFAULT_PAGES_SCOPE_REAL

