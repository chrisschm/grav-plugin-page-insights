enabled: true
db: user/data/page-insights.sqlite
ignore_errors: true
anonymize_ips: false
# Off by default: CF-Connecting-IP / Client-IP / X-Forwarded-For are all
# client-settable headers. Only enable this if you know your setup puts a
# trusted reverse proxy (e.g. Cloudflare) in front of every request, so
# these headers can't be forged by the visitor themselves.
trust_proxy_headers: false
log_admin: true
log_bot: true
page_url_format: 'url'


collector_ping_interval: 15
log_time_on_page: true
datetime_offset: 'localtime'

default_pages_scope: all

# Path to the built geo country index, relative to the Grav root - same
# convention as `db` above. Deliberately outside the plugin's own directory
# (user/data/, not user/plugins/page-insights/data/) so it survives a GPM
# update, which replaces the whole plugin directory on every install
# (see docs/ARCHITECTURE.md, "Notable past bugs" #8).
geo_db_index_path: user/data/page-insights/geo-country-index.bin

# Empty = use CountryIndexBuilder::DEFAULT_SOURCE_URL (the RIPE NCC/NRO
# combined RIR delegated-stats "latest" snapshot). See blueprints.yaml,
# tab_general -> section_geolocation.
geo_db_source_url: ''

# "disabled"|"weekly"|"monthly" - see PageInsightsPlugin::onSchedulerInitialized()
# and classes/AutoSchedule.php for what this actually schedules and why the
# admin doesn't pick a concrete day/time. On by default: this only refreshes
# a lookup file, it never touches collected stats.
geo_db_auto_update: weekly

# Same "disabled"|"weekly"|"monthly" choice as geo_db_auto_update above, but
# for automatically deleting old stats (see cli/PruneCommand.php,
# Stats::pruneData()). Off by default, unlike the geo-db refresh - deleting
# stats is irreversible, so this is opt-in, not opt-out.
data_auto_prune: disabled

# How far back automatic pruning reaches when data_auto_prune is enabled -
# same relative ("90d"/"12w"/"6m"/"1y") or absolute ("2025-01-01") syntax as
# the `prune` CLI command's --older-than option, see classes/RelativeDate.php.
data_auto_prune_older_than: '365d'

show_top_users_widget: true
cols_top_users_widget: 'col-12 col-md-3'
limit_top_users_widget: 10
show_unique_users_widget: true
cols_unique_users_widget: 'col-12 col-md-4'
show_unique_visitors_widget: true
cols_unique_visitors_widget: 'col-12 col-md-4'
show_page_views_widget: true
cols_page_views_widget: 'col-12 col-md-4'
show_recently_viewed_pages: true
cols_recently_viewed_pages: col-12
limit_recently_viewed_pages: 15
show_top_pages: true
cols_top_pages: 'col-12 col-md-9'
limit_top_pages_pages: 15
show_status_codes: true
cols_status_codes: 'col-12 col-md-3'
show_top_countries: true
cols_top_countries: 'col-12 col-md-3'
limit_top_countries: 5
show_top_browsers: true
cols_top_browsers: 'col-12 col-md-3'
limit_top_browsers: 10
show_top_platforms: true
cols_top_platforms: 'col-12 col-md-3'
limit_top_platforms: 10
show_pagedetails_recent_views: true
cols_pagedetails_recent_views: col-12
limit_pagedetails_recent_views: 15
style_top_browsers: chart
style_top_platforms: chart
style_top_countries: chart
ignored_urls:
