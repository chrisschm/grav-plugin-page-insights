name: Bug Report
about: Report a problem with the Page Insights plugin
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in as much detail as possible — the project
        currently has no automated test suite, so a good report is the fastest way to a fix.
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: See Admin panel, blueprints.yaml, or CHANGELOG.md
      placeholder: e.g. 3.0.0
    validations:
      required: true
  - type: dropdown
    id: admin-ui
    attributes:
      label: Admin UI
      description: Page Insights ships two separate UIs — which one were you using?
      options:
        - Admin2 (Grav 2.0)
        - Classic Admin (Grav 1.7)
        - Not admin-related (front-end / data collection)
    validations:
      required: true
  - type: input
    id: grav-version
    attributes:
      label: Grav version
      placeholder: e.g. 1.7.45 or 2.0.3
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
      description: Plugin requires PHP >= 7.1.3
      placeholder: e.g. 8.3
    validations:
      required: true
  - type: dropdown
    id: database-origin
    attributes:
      label: Database file
      description: Relevant for anything involving data, migrations, or unexpected/missing stats
      options:
        - Freshly created by the plugin
        - Copied/migrated from an existing Page Stats installation
        - Not sure
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do, what did you expect to happen, what happened instead?
      placeholder: |
        1. Open the Page Insights dashboard in Admin2
        2. Click into "Page Detail" for a specific page
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / error messages
      description: >-
        Grav log output, PHP errors, or browser console output. Please redact any private
        feed URLs or credentials before pasting.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I checked existing issues for a duplicate before opening this one
          required: true
        - label: I'm using the latest released version of Page Insights
          required: false
