name: Create Release from Tag

on:
  push:
    tags:
      # Bare numeric tags (3.0.0), matching Grav's GPM convention - not
      # v-prefixed. GPM version sorting and GitHub's releases/latest (which
      # update checks rely on) both expect this. Starting with a digit also
      # keeps internal dev tags (develop-JJJJ-MM-TT, test-...) from
      # triggering a release, same as the previous 'v*' filter did.
      - '[0-9]*.[0-9]*.[0-9]*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --repo "${{ github.repository }}"